name: KSVQE_paper7class
num_epochs: 50
l_num_epochs: 0
warmup_epochs: 2.5
ema: true
save_model: true
batch_size: 8
num_workers: 6
split_seed: 42
ddp: False
wandb:
    project_name: KSVQE

# ==================== KSVQE loss ablation controls ====================
# Paper-like 7-class approximation: original + six QP bins.
loss:
    contrastive_weight: 0.3
    rank_weight: 0.0
# ======================================================================

data:
    train:
        type: ViewDecompositionDataset_KVQ
        args:
            weight: 0.540
            phase: train
            anno_file: dataset_csv/KVQ_paper_split/train_80ref_7class.txt
            data_prefix: data/KVQ-dataset
            sample_types:
                technical:
                    fragments_h: 9
                    fragments_w: 9
                    fsize_h: 32
                    fsize_w: 32
                    size_h: 112
                    size_w: 112
                    aligned: 8
                    clip_len: 32
                    frame_interval: 2
                    num_clips: 1

    val:
        type: ViewDecompositionDataset_KVQ
        args:
            phase: test
            anno_file: dataset_csv/KVQ_paper_split/val_20ref_7class.txt
            data_prefix: data/KVQ-dataset
            sample_types:
                technical:
                    fragments_h: 9
                    fragments_w: 9
                    fsize_h: 32
                    fsize_w: 32
                    size_h: 112
                    size_w: 112
                    aligned: 8
                    clip_len: 32
                    frame_interval: 2
                    num_clips: 3

model:
    type: KSVQE
    args:
        KSVQE:
            backbone:
                    checkpoint: true
                    pretrained:
                    num_samples: 1
                    sample_type: topkpertubation
                    CLIP_location: 8
                    cls_use: True
                    tuning_stage: 1
                    a1: 1
                    a2: 2
                    qls_swin: True
                    frozen3D: False
                    frozen_stages: -1

            backbone_preserve_keys: technical
            divide_head: true
            head:
                    in_channels: 768
                    hidden_channels: 64

optimizer:
    lr: !!float 3e-5
    backbone_lr_mult: !!float 1
    wd: 0.05

load_path: pretrained_weights/KSVQE_techniqual_pretrainonLSVQ.pth
test_load_path:
